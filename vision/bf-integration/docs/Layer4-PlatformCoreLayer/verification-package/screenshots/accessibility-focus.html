  <h2>Focus Management</h2>
  <p>Open modal and press <kbd>Escape</kbd> to close; first control receives focus.</p>
  <button id="open">Open Modal</button>
  <div class="modal" id="modal" role="dialog" aria-modal="true" style="display:block;margin-top:12px">
    <label>First input: <input id="first" /></label>
    <button id="close">Close</button>
  </div>
